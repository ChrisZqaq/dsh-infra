# dsh-ledger bundle patch.
#
# One Host row mounts the package. The sidebar $ entry and the panel behind it
# are both Client halves declared in package.json `dsh.client`; the row id, the
# client factory id, and the package name must all agree.
- insert:
    - id: dsh-ledger
      name: '@local/dsh-ledger'
      config: {}
