# cp 到 ~/.dsh/infra/assets.yml 就是一份能用的初始数据。
# 面板里点「保存」会按这个结构整份写回。
version: 2
updatedAt: ''
rate:
  HKD_CNY: 0.917

money:
  - id: money-1
    name: 示例现金
    kind: 现金
    currency: CNY
    quantity: 1
    price: 24000
    note: ''
  - id: money-2
    name: 示例持仓
    kind: 持仓
    currency: HKD
    quantity: 200
    price: 380
    note: 港股，按顶部汇率折算
  - id: money-3
    name: 示例负债
    kind: 负债
    currency: CNY
    quantity: 1
    price: 800000
    note: 负债填正数，面板自己加负号

devices:
  - id: device-1
    name: 示例服务器
    type: 服务器
    address: ssh HOST_ALIAS
    specs: 2C2G · Linux
    status: 未知
    note: 可选备注

repos:
  - id: repo-1
    name: ChrisZqaq/dsh-ledger
    visibility: public
    language: JavaScript
    committedAt: 2026-11-13
    description: DSH 资产面板
    remote: git@github.com:ChrisZqaq/dsh-ledger.git
    note: 手写备注，同步不会覆盖

keys:
  - id: key-1
    name: PROVIDER
    purpose: 文本生成
    value: EXAMPLE_KEY
    location: 密码管理器
    expiresAt: 2027-01-01
  - id: key-2
    name: PROVIDER_2
    purpose: 长文本
    value: ''
    location: 只记密码管理器中的位置，不记密钥
    expiresAt: ''
